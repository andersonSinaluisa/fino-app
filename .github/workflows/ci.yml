name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore Nexo.sln

      - name: Build
        working-directory: backend
        # Warnings are visible but do not fail the build; correctness is the tests' job.
        run: dotnet build Nexo.sln --configuration Release --no-restore

      - name: Test
        working-directory: backend
        # Integration tests run against SQLite, so no database service is needed.
        run: dotnet test Nexo.sln --configuration Release --no-build --verbosity normal

  mobile:
    name: Mobile (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Test
        working-directory: mobile
        run: npm test
