services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fino-api:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Nexo__Database__AutoMigrate: ${Nexo__Database__AutoMigrate:-false}
      Nexo__Seed__Demo: "false"
      Nexo__RateLimiting__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
